name: 下架 / 恢复上架 · Delist or relist
description: 把作品从开源广场下架，或恢复已下架的作品 / Take your launch down, or bring a delisted one back
title: "[Delist] "
labels: ["launchpad-delist"]
body:
  - type: markdown
    attributes:
      value: |
        机器人会生成对应的 PR，维护者核对后合并即生效。下架不删除讨论帖；恢复会重新体检仓库，并沿用原讨论帖与上架时间。
        The bot opens a PR and a maintainer merges it. Delisting keeps the discussion thread; relisting re-checks the repository and keeps the original thread and launch date.
  - type: input
    id: repo_url
    attributes:
      label: 开源仓库地址 / Repository URL
      description: 与投稿时一致的仓库地址
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: 操作 / Action
      options:
        - delist — 下架 / Delist
        - relist — 恢复上架 / Relist
    validations:
      required: true
  - type: textarea
    id: note
    attributes:
      label: 说明 / Note
      description: 可选，写入 PR 与下架记录（折叠为单行，上限 280 字） / Optional, recorded in the PR
    validations:
      required: false
