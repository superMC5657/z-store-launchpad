name: Expire pins and refresh pulse

# 每日撤下到期置顶并刷新 Star / 讨论热度与 7 日涨星；仅在实质变化时提交一次。

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  statuses: write

concurrency:
  group: launchpad-json-write
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh manifest
        id: refresh
        run: node scripts/refresh-pulse-and-pins.mjs
      - name: Validate manifest
        run: |
          node scripts/validate-launchpad.mjs
          node scripts/build-launchpad.mjs --check-sources
      - name: Commit and push
        if: steps.refresh.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name "zstore-launchpad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launchpad.json state/stars-history.json
          if [ -d launches ]; then git add launches/; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: expire pins and refresh pulse [skip ci]"
          git pull --rebase origin main
          if git push origin HEAD:main 2>/dev/null; then
            exit 0
          fi
          branch="chore/refresh-pulse-$(date +%s)"
          git checkout -B "$branch"
          git push --force origin "HEAD:refs/heads/$branch"
          pr_url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "chore: expire pins and refresh pulse [skip ci]" \
            --body "每日置顶过期清理与热度统计刷新。")
          sha=$(git rev-parse HEAD)
          gh api -X POST "repos/$REPO/statuses/$sha" \
            -f state=success \
            -f context=launchpad-ingest \
            -f description="launchpad.json validated by refresh"
          gh pr merge "$pr_url" --repo "$REPO" --squash --delete-branch
