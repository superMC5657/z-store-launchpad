name: Build Launchpad

# 当 launches/ 合入 main 后（或定时/手动触发）：
# 1. 清理过期置顶、为新条目在 Launches 分类创建 Discussion；
# 2. 编译生成根目录 launchpad.json 并运行全量校验；
# 3. 提交推送（若 main 开启规则集直推拦截则自动降级为 PR + auto-merge）；
# 4. 向源 Issue 回复深链与 README 徽章并自动关单。

on:
  push:
    branches: [main]
    paths:
      - 'launches/**'
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write
  statuses: write

concurrency:
  group: launchpad-json-write
  cancel-in-progress: false

jobs:
  build:
    name: Build launchpad.json
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}
      GITHUB_TOKEN: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Bind discussions and build launchpad.json
        run: |
          node scripts/build-launchpad.mjs \
            --prune-pins \
            --bind-discussions \
            --pending-issues-out /tmp/pending-issues.json
          node scripts/validate-launchpad.mjs

      - name: Commit and push launchpad.json
        run: |
          set -euo pipefail
          git config user.name "zstore-launchpad-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launchpad.json launches/
          if git diff --staged --quiet; then
            echo "launchpad.json and launches/ are already up to date."
            exit 0
          fi
          git commit -m "chore(launchpad): build launchpad.json [skip ci]"

          if git push origin main 2>/dev/null; then
            echo "Direct push to main succeeded."
            exit 0
          fi

          echo "Direct push blocked by ruleset, falling back to PR..."
          branch="chore/build-launchpad-$(date +%s)"
          git checkout -B "$branch"
          git push --force origin "HEAD:refs/heads/$branch"
          pr_url=$(gh pr create --repo "$REPO" --base main --head "$branch" \
            --title "chore(launchpad): build launchpad.json [skip ci]" \
            --body "由 build-launchpad.yml 自动从 launches/ 编译生成。")
          sha=$(git rev-parse HEAD)
          gh api -X POST "repos/$REPO/statuses/$sha" \
            -f state=success \
            -f context=launchpad-ingest \
            -f description="launchpad.json validated by build"
          gh pr merge "$pr_url" --repo "$REPO" --squash --delete-branch

      - name: Announce merged issues
        if: hashFiles('/tmp/pending-issues.json') != ''
        run: node scripts/build-launchpad.mjs --announce-file /tmp/pending-issues.json
