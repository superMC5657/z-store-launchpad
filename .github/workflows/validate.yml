name: Validate

# PR 门禁：只读权限，校验 launches/ 真源与 launchpad.json，并跑脚本单测。

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm run validate && npm test
