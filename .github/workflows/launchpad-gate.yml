name: Launchpad Gate

# 为所有 PR 生成统一的 launchpad-ingest commit status。
# - 人工/同仓库 PR：本 workflow 用 base 分支的可信脚本校验 PR 变更的 launches/ 后写 status；
# - bot PR：pull_request run 会停在 approval-required，由 issue-to-pr.yml 自己写 status；
# - fork PR：GITHUB_TOKEN 只读，无法写 status，需维护者检查通过后 bypass 合并。

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  statuses: write

concurrency:
  group: launchpad-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gate:
    name: Launchpad Gate
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate PR launches with base scripts
        id: validate
        run: |
          set +e
          git fetch --depth=1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          changed_launches=$(git diff --name-only HEAD FETCH_HEAD -- launches/ 2>/dev/null || true)
          if [ -n "$changed_launches" ]; then
            git checkout FETCH_HEAD -- launches/
          fi
          node scripts/build-launchpad.mjs --check-sources && \
            node scripts/build-launchpad.mjs --allow-pending-discussion --out /tmp/launchpad-check.json
          rc=$?
          echo "code=$rc" >> "$GITHUB_OUTPUT"

      - name: Post success status
        if: >-
          steps.validate.outputs.code == '0' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=success \
            -f context=launchpad-ingest \
            -f description="launches/ validated by gate"

      - name: Post failure status
        if: >-
          steps.validate.outputs.code != '0' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.event.pull_request.head.sha }}" \
            -f state=failure \
            -f context=launchpad-ingest \
            -f description="launches/ validation failed"
          exit 1

      - name: Fork PR note
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: |
          echo "Fork PR: 只读 token 无法写 launchpad-ingest status；请维护者检查后手动合并。" >> "$GITHUB_STEP_SUMMARY"
