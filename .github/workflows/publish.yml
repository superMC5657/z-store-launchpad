name: Publish

# 维护者 merge 后：为新条目绑定讨论帖 → 从 launches/ 编译 launchpad.json → 推送 main。
# 每日定时顺带撤下到期置顶、刷新星数与讨论热度（不做任何上下架）。

on:
  push:
    branches: [main]
    paths: ['launches/**']
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write
  discussions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.LAUNCHPAD_BOT_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/build-launchpad.mjs --bind-discussions
      - if: github.event_name != 'push'
        run: node scripts/refresh-pulse-and-pins.mjs
      - run: npm run validate
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add launchpad.json launches/ state/
          git diff --cached --quiet || { git commit -m "chore: publish launchpad.json [skip ci]" && git pull --rebase origin main && git push; }
